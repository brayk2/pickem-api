{#-
  Shared shell for every PickEm email.

  Styles are inline on purpose: Gmail and Outlook drop most <style> rules, and
  table layout is the one thing every client renders the same way.

  Blocks: `preheader` (inbox preview text), `heading`, `content`, `footer`.
-#}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}PickEm{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f5f7;">
    <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">{% block preheader %}{% endblock %}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:{% block max_width %}480px{% endblock %};background-color:#ffffff;border-radius:8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2933;">
            <tr>
              <td style="padding:24px 32px 0 32px;font-size:13px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#1d4ed8;">
                PickEm
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 8px 32px;">
                <h1 style="margin:0;font-size:22px;line-height:1.3;font-weight:600;">{% block heading %}{% endblock %}</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 24px 32px;font-size:15px;line-height:1.6;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 32px 32px;border-top:1px solid #e4e7eb;font-size:12px;line-height:1.6;color:#7b8794;">
                {% block footer %}You're receiving this because you have a PickEm account.{% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
