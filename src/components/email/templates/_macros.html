{#- Shared pieces for email templates. Import with {% from "_macros.html" import button %}. -#}
{% macro button(url, label) -%}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
  <tr>
    <td style="border-radius:6px;background-color:#1d4ed8;">
      <a href="{{ url }}" style="display:inline-block;padding:12px 28px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:6px;">{{ label }}</a>
    </td>
  </tr>
</table>
{% endmacro %}
