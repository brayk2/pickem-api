name: 'Build'

on:
  push:
    branches:
      - main
      - feature/*

env:
  AWS_BUCKET: "pickem-api"
  AWS_LAMBDA: "pickem-api"
  EMAIL_HANDLER_LAMBDA: "pickem-email-handler"

permissions:
  id-token: write
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Setup python'
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 'Install Poetry'
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::881413588329:role/Pickem_Deployer
          aws-region: us-east-1

      - name: 'Extract Version'
        id: extract_version
        run: |
          version=$(poetry version --short)
          echo "project_version=${version}" >> $GITHUB_ENV

      - name: 'Check if Release Exists'
        id: check_release_exists
        run: |
          release_file="${{ env.project_version }}-release.zip"
          if aws s3 ls s3://${{ env.AWS_BUCKET }}/${release_file}; then
            echo "Error: Release ${release_file} already exists. Please bump the version before proceeding."
            exit 1
          else
            echo "No release found, proceeding with current version."
          fi

      - name: 'Determine Artifact Name and Tag'
        id: determine_artifact_name
        run: |
          branch_name=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')

          # Determine artifact name based on the branch
          if [[ "${branch_name}" == feature/* ]]; then
            branch_suffix=$(echo "${branch_name}" | sed 's|feature/||')
            artifact_name="${{ env.project_version }}-${branch_suffix}-snapshot.zip"
            artifact_tag="version=snapshot"
          elif [[ "${branch_name}" == main ]]; then
            artifact_name="${{ env.project_version }}-release.zip"
            artifact_tag="version=release"
          else
            echo "Invalid branch naming does not match feature/* or main"
            exit 1
          fi

          # Save the S3 object name to a file
          echo "${artifact_name}" > s3_object_name.txt
          cat s3_object_name.txt

          # Set environment variables for later steps
          echo "artifact_name=${artifact_name}" >> $GITHUB_ENV
          echo "artifact_tag=${artifact_tag}" >> $GITHUB_ENV
      

      - name: 'Upload Step Data as Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: s3-object-name
          path: s3_object_name.txt

      - name: 'Create Package'
        id: create_package
        run: |
          poetry --version
          poetry run python --version
          poetry install --no-interaction --no-ansi
          poetry build
          poetry run pip install --upgrade --target package dist/*.whl
          cd package && zip -r ../${{ env.artifact_name }} . -x '*.pyc'

      # The email handler (src/lambdas/send_email.py) only needs pydantic,
      # pydantic-settings and jinja2 -- boto3 comes with the Lambda runtime.
      # The full package is over Lambda's 250 MB limit for a separate function,
      # so it gets its own, pinned to the versions just installed above.
      # If send_email.py grows a new third-party import, add it here.
      - name: 'Create Email Handler Package'
        id: create_email_handler_package
        run: |
          poetry run pip list --path package --format=freeze > package-constraints.txt
          poetry run pip install --target email_package --no-deps dist/*.whl
          poetry run pip install --target email_package -c package-constraints.txt \
            pydantic pydantic-settings jinja2
          cd email_package && zip -r ../email-handler.zip . -x '*.pyc'

      - name: 'Upload to S3'
        run: |
          aws s3 cp ${{ env.artifact_name }} s3://${{ env.AWS_BUCKET }}/
          aws s3 cp email-handler.zip s3://${{ env.AWS_BUCKET }}/email-handler/${{ env.artifact_name }}

      - name: 'Add Tags to S3 Object'
        run: |
          for key in "${{ env.artifact_name }}" "email-handler/${{ env.artifact_name }}"; do
            aws s3api put-object-tagging --bucket ${{ env.AWS_BUCKET }} --key "${key}" \
              --tagging '{"TagSet":[{"Key":"version","Value":"${{ env.artifact_tag }}"}]}'
          done
  Deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 'Download S3 Object Name Artifact'
        uses: actions/download-artifact@v4
        with:
          name: s3-object-name

      - name: 'Read S3 Object Name'
        id: read_s3_object_name
        run: |
          s3_object_name=$(cat s3_object_name.txt)
          echo "s3_object_name=${s3_object_name}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::881413588329:role/Pickem_Deployer
          aws-region: us-east-1

      - name: 'Set Lambda Function Name'
        id: set_lambda_name
        run: |
          branch_name=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')

          # Set lambda function names based on branch
          if [[ "${branch_name}" == feature/* ]]; then
            suffix="_dev"
          elif [[ "${branch_name}" == main ]]; then
            suffix="_prod"
          else
            echo "Invalid branch name"
            exit 1
          fi

          echo "AWS_LAMBDA=${{ env.AWS_LAMBDA }}${suffix}" >> $GITHUB_ENV
          echo "EMAIL_HANDLER_LAMBDA=${{ env.EMAIL_HANDLER_LAMBDA }}${suffix}" >> $GITHUB_ENV

      - name: 'Update Lambda Function with S3 Object Name'
        run: |
          aws lambda update-function-code \
            --function-name=${{ env.AWS_LAMBDA }} \
            --s3-bucket=${{ env.AWS_BUCKET }} \
            --s3-key=${{ env.s3_object_name }} \
            --cli-read-timeout 60 \
            --cli-connect-timeout 60

      - name: 'Update Email Handler Lambda'
        run: |
          aws lambda update-function-code \
            --function-name=${{ env.EMAIL_HANDLER_LAMBDA }} \
            --s3-bucket=${{ env.AWS_BUCKET }} \
            --s3-key=email-handler/${{ env.s3_object_name }} \
            --cli-read-timeout 60 \
            --cli-connect-timeout 60

    needs: Build
